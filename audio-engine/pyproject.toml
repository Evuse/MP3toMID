[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tunemorph-audio-engine"
version = "0.1.0"
description = "Replaceable DSP and arrangement engine for TuneMorph"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1", "black>=24,<26"]

[tool.hatch.build.targets.wheel]
packages = ["src/tunemorph_audio"]
