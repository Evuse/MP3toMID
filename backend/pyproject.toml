[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tunemorph-backend"
version = "0.1.0"
description = "TuneMorph HTTP API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.18,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.20,<1",
  "uvicorn[standard]>=0.32,<1",
  "tunemorph-audio-engine>=0.1.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1", "black>=24,<26"]

[tool.hatch.build.targets.wheel]
packages = ["src/tunemorph_backend"]
