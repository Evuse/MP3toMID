[tool.pytest.ini_options]
testpaths = ["backend/tests", "audio-engine/tests", "tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"backend/src/tunemorph_backend/api.py" = ["B008"]

[tool.black]
line-length = 100
target-version = ["py311"]
